[project]
name = "first_app"
version = "0.1.0"
description = "My first Python application project."
requires-python = ">=3.10"
readme = "README.md"
authors = [
    { name = "Brett" }
]

dependencies = [
    "fastapi",
    "uvicorn",
    "httpx2"
]

[project.scripts]
first-app = "first_app.cli:main"


[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I"]
ignore = []
exclude = ["tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
